[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "A GPT-style language model implemented from scratch"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.6.0",
    "tiktoken>=0.9.0",
    "matplotlib>=3.10.1",
    "numpy>=2.0.2",
    "pandas>=2.2.1",
    "requests",
    "tqdm>=4.66.1",
    "transformers>=4.33.2",
    "ollama",
]

[project.scripts]
gpt2 = "src.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=2.0",
    "ipdb>=0.13.13",
    "jupyterlab>=4.0",
    "nbformat>=5.7.0",
    "psutil>=5.9.5",
    "tensorflow>=2.18.0",
    "thop",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]